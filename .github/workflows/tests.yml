name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  macos:
    runs-on: macos-14          # arm64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install numpy + gmp
        run: |
          python3 -m pip install numpy
          brew install gmp llvm
          echo "MLIR_BIN=$(brew --prefix llvm)/bin" >> $GITHUB_ENV

      - name: Build J engine from jsource
        run: |
          git clone --depth 1 https://github.com/jsoftware/jsource.git ../jsource
          cd ../jsource/make2
          # darwin arm64 release build (matches jsource build notes)
          ./build_libj.sh
          ./build_jconsole.sh
          ./cpbin.sh

      - name: Copy engine runtime into project
        run: |
          mkdir -p jlibrary/bin
          cp ../jsource/jlibrary/bin/* jlibrary/bin/ || true

      - name: Build pyj
        run: ./build.sh

      - name: Run all test suites
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/jlibrary/bin
          PYJ_LIBPATH: ${{ github.workspace }}/jlibrary/bin
        run: |
          for t in test_pyj.py test_ad.py test_nn.py test_ops2.py \
                   test_train2.py test_compile.py test_ops3.py test_ops4.py \
                   test_ops5.py test_mlir.py; do
            echo "== $t =="
            python3 "$t"
          done

      - name: C host end-to-end (train.c)
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/jlibrary/bin
        run: ./host/train jlibrary/bin .

      - name: Vendored zero-build demo
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/vendor
        working-directory: vendor
        run: ./vendor_demo

  linux:
    runs-on: ubuntu-24.04       # x86_64, j64avx2 build path
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build prereqs
        run: |
          python3 -m pip install numpy
          sudo apt-get update
          sudo apt-get install -y libgmp-dev clang

      - name: Build J engine from jsource
        run: |
          git clone --depth 1 https://github.com/jsoftware/jsource.git ../jsource
          cd ../jsource/make2
          ./build_libj.sh        # auto-detects linux/j64avx2
          ./build_jconsole.sh
          ./cpbin.sh

      - name: Copy engine runtime into project
        run: |
          mkdir -p jlibrary/bin
          cp ../jsource/jlibrary/bin/* jlibrary/bin/ || true

      - name: Build pyj
        run: ./build.sh

      - name: Run all test suites
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/jlibrary/bin
          PYJ_LIBPATH: ${{ github.workspace }}/jlibrary/bin
          PYTHONFAULTHANDLER: 1
        run: |
          for t in test_pyj.py test_ad.py test_nn.py test_ops2.py \
                   test_train2.py test_compile.py test_ops3.py test_ops4.py \
                   test_ops5.py; do
            echo "== $t =="
            python3 "$t"
          done

      - name: C host end-to-end (train.c)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/jlibrary/bin
        run: ./host/train jlibrary/bin .

      - name: Vendored zero-build demo
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/vendor
        working-directory: vendor
        run: ./vendor_demo
        # test_mlir.py skipped on this job: it needs the full llvm suite with
        # linalg dialect support; CI keeps the linux job lean. The macOS job
        # covers the exporter.
