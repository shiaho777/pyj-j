# C-line: scheduled differential scans. Each run harvests one live
# ethereum window, auto-captures tick context for any LEAD at block time
# (the archive-wall breaker), and commits the accumulating evidence in
# solver/scanlog/. Free-tier RPCs only.
name: differential-scan
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # the native archive persists across runs -- the whole point of the
      # paywall-breaker. Without this, every run is a one-shot window and
      # cross-block pairs (the 35-400x surface multiplication) never form.
      - name: restore event archive
        uses: actions/cache@v4
        with:
          path: solver/scanstore.db
          key: scanstore-${{ github.run_id }}
          restore-keys: |
            scanstore-
      - name: run differential scanner
        run: python3 solver/scan.py eth base arb
      - name: commit accumulated scanlog
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add solver/scanlog
          if git diff --cached --quiet; then
            echo "no new evidence this window"
          else
            git commit -m "scan: automated window [skip ci]"
            git push
          fi
      # caches are immutable: each run saves a fresh snapshot (post-step),
      # so prune ALL older scanstore entries -- exactly one archive
      # snapshot (the newest) exists at any time
      - name: prune stale archive caches
        run: |
          for key in $(gh cache list --json key -q '.[].key' 2>/dev/null | grep '^scanstore-' || true); do
            echo "pruning $key"
            gh cache delete "$key" || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
