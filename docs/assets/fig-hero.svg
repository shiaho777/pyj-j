<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <!-- fig-hero: claim -> verify -> verdict. All values from recon/REPORT.md case 03/05. -->
  <rect width="880" height="420" fill="#FFFFFF"/>
  <text x="440" y="40" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#0F172A">Every claim recomputed. No float gets through.</text>
  <text x="440" y="64" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#475569">JSON parse_float captures the literal — 0.1 means 1/10 before any binary float can touch it</text>

  <!-- panel 1: the claim -->
  <rect x="24" y="90" width="240" height="190" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="144" y="118" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#475569">① THE CLAIM</text>
  <rect x="44" y="132" width="200" height="86" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="144" y="156" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#0F172A">1 - cos(1e-8)</text>
  <text x="144" y="178" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#DC2626">= 0.0</text>
  <text x="144" y="198" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#94A3B8">float64 rounds cos to 1.0</text>
  <text x="144" y="248" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#475569">the answer vanishes</text>
  <text x="144" y="264" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#475569">(catastrophic cancellation)</text>

  <path d="M270 185 H310" stroke="#94A3B8" stroke-width="2" fill="none"/>
  <polygon points="310,179 322,185 310,191" fill="#94A3B8"/>

  <!-- panel 2: verify -->
  <rect x="326" y="90" width="240" height="190" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="446" y="118" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#475569">② TALLY VERIFY</text>
  <rect x="346" y="132" width="200" height="86" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <text x="446" y="152" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#0F172A">x = 1r100000000</text>
  <text x="446" y="170" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#0F172A">Taylor series, rationals</text>
  <text x="446" y="188" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#2563EB">exact engine (GMP)</text>
  <text x="446" y="206" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#94A3B8">no float ever enters</text>
  <text x="446" y="248" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#475569">recompute in exact</text>
  <text x="446" y="264" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#475569">rational arithmetic</text>

  <path d="M572 185 H612" stroke="#94A3B8" stroke-width="2" fill="none"/>
  <polygon points="612,179 624,185 612,191" fill="#94A3B8"/>

  <!-- panel 3: verdict -->
  <rect x="628" y="90" width="228" height="190" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="742" y="118" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#475569">③ THE VERDICT</text>
  <rect x="648" y="132" width="188" height="86" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1"/>
  <text x="742" y="156" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#059669">match: false</text>
  <text x="742" y="176" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#0F172A">exact: 5.00...e-17</text>
  <text x="742" y="194" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#0F172A">(exact rational)</text>
  <text x="742" y="248" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#475569">the truth survives,</text>
  <text x="742" y="264" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#475569">non-zero and exact</text>

  <!-- bottom band: key metrics -->
  <rect x="24" y="306" width="832" height="90" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
  <text x="440" y="334" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A">The claim-checker, not the calculator — agents bring claims, Tally grades them</text>
  <rect x="76" y="350" width="210" height="30" rx="15" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="181" y="369" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#0F172A">terminal: <tspan font-weight="700" fill="#DC2626">13 fails / 15</tspan></text>
  <rect x="336" y="350" width="210" height="30" rx="15" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="441" y="369" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#0F172A">exact ops: <tspan font-weight="700" fill="#059669">37</tspan></text>
  <rect x="596" y="350" width="210" height="30" rx="15" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="701" y="369" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#0F172A">engine: <tspan font-weight="700" fill="#2563EB">5.0 MB</tspan></text>
</svg>
